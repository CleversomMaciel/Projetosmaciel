<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projetos freelance remotos — Bico BR</title>
  <meta name="description" content="Projetos freelance e serviços rápidos para fazer de qualquer lugar do Brasil. Filtre por área e envie sua proposta.">
  <link rel="canonical" href="{{PUBLIC_URL}}/projetos">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Bico BR">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Projetos freelance remotos — Bico BR">
  <meta property="og:description" content="Projetos freelance e serviços rápidos para fazer de qualquer lugar do Brasil. Filtre por área e envie sua proposta.">
  <meta property="og:url" content="{{PUBLIC_URL}}/projetos">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#0d7a4b">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="flex min-h-screen flex-col">
  <a href="#conteudo" class="sr-only focus:not-sr-only focus:absolute focus:left-3 focus:top-3 focus:z-50 focus:rounded-lg focus:bg-white focus:px-3 focus:py-2">Pular para o conteúdo</a>
  <header id="site-header" class="sticky top-0 z-40 border-b border-tinta/10 bg-areia/95 backdrop-blur">
    <div class="wrap flex items-center justify-between py-3">
      <a href="/" class="text-lg font-extrabold tracking-tight">Bico<span class="text-mata-600"> BR</span></a>
      <a class="btn-primary" href="/cadastro">Criar conta</a>
    </div>
  </header>
  <main id="conteudo" class="flex-1">
    <section class="wrap py-10">
      <h1 class="text-3xl font-extrabold tracking-tight" id="titulo">Projetos remotos</h1>
      <form id="filtros" class="mt-6 grid gap-3 md:grid-cols-[1fr_16rem_12rem_auto]" role="search">
        <div><label class="sr-only" for="q">Buscar</label><input class="input" id="q" name="q" placeholder="Buscar por palavra-chave"></div>
        <div><label class="sr-only" for="categoria">Área</label><select class="input" id="categoria" name="categoria"><option value="">Todas as áreas</option></select></div>
        <div><label class="sr-only" for="tipo">Tipo</label><select class="input" id="tipo" name="tipo"><option value="">Projetos e Bico Rápido</option><option value="project">Projetos</option><option value="quick">Bico Rápido</option></select></div>
        <button class="btn-primary" type="submit">Filtrar</button>
      </form>
      <p id="aviso" class="mt-4" hidden></p>
      <ul id="lista" class="mt-6 grid gap-4" aria-live="polite"></ul>
      <div class="mt-6 text-center"><button id="mais" class="btn-ghost" type="button" hidden>Carregar mais</button></div>
    </section>
  </main>
  <footer id="site-footer" class="border-t border-tinta/10 bg-white"></footer>
  <script src="/vendor/supabase.js" defer></script>
  <script type="module" src="/js/projetos.js"></script>
</body>
</html>
