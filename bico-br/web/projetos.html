<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projetos freelance remotos — Bico BR</title>
  <meta name="description" content="Projetos freelance e serviços rápidos para fazer de qualquer lugar do Brasil. Filtre por área e envie sua proposta.">
  <link rel="canonical" href="{{PUBLIC_URL}}/projetos">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Bico BR">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Projetos freelance remotos — Bico BR">
  <meta property="og:description" content="Projetos freelance e serviços rápidos para fazer de qualquer lugar do Brasil. Filtre por área e envie sua proposta.">
  <meta property="og:url" content="{{PUBLIC_URL}}/projetos">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#0d7a4b">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="flex min-h-screen flex-col">
  <a href="#conteudo" class="sr-only focus:not-sr-only focus:absolute focus:left-3 focus:top-3 focus:z-50 focus:rounded-lg focus:bg-white focus:px-3 focus:py-2">Pular para o conteúdo</a>
  <header id="site-header" class="sticky top-0 z-40 border-b border-tinta/10 bg-areia/95 backdrop-blur">
    <div class="wrap flex items-center justify-between py-3">
      <a href="/" class="text-lg font-extrabold tracking-tight">Bico<span class="text-mata-600"> BR</span></a>
      <a class="btn-primary" href="/cadastro">Criar conta</a>
    </div>
  </header>
  <main id="conteudo" class="flex-1">
    <section class="wrap py-8 lg:py-12">
      <p class="kicker">100% remoto</p>
      <h1 class="mt-1 text-3xl font-extrabold sm:text-4xl" id="titulo">Projetos remotos</h1>
      <form id="filtros" class="card mt-6 grid gap-3 p-3 md:grid-cols-[1fr_15rem_13rem_auto] md:items-center md:rounded-full md:p-2" role="search">
        <div><label class="sr-only" for="q">Buscar</label><input class="input md:rounded-full md:border-0 md:shadow-none" id="q" name="q" placeholder="Buscar por palavra-chave"></div>
        <div><label class="sr-only" for="categoria">Área</label><select class="input md:rounded-full md:border-0 md:shadow-none" id="categoria" name="categoria"><option value="">Todas as áreas</option></select></div>
        <div><label class="sr-only" for="tipo">Tipo</label><select class="input md:rounded-full md:border-0 md:shadow-none" id="tipo" name="tipo"><option value="">Projetos e Bico Rápido</option><option value="project">Projetos</option><option value="quick">Bico Rápido</option></select></div>
        <button class="btn-primary" type="submit">Filtrar</button>
      </form>
      <label id="so-meus" class="mt-3 inline-flex cursor-pointer items-center gap-2 text-sm font-semibold text-tinta-700" hidden><input class="h-4 w-4 accent-mata-600" type="checkbox" id="para-mim"> Só projetos que combinam com as minhas habilidades</label>
      <p id="aviso" class="mt-4" hidden></p>
      <div class="mt-6 grid gap-6 lg:grid-cols-[minmax(0,1fr)_19rem]">
        <div>
          <ul id="lista" class="grid gap-4" aria-live="polite"></ul>
          <div class="mt-6 text-center"><button id="mais" class="btn-ghost" type="button" hidden>Carregar mais</button></div>
        </div>
        <aside class="space-y-4 lg:sticky lg:top-24 lg:self-start" aria-label="Espaço publicitário e dicas">
          <div id="ad-lateral" class="grid gap-4"></div>
          <div class="panel text-sm"><p class="font-bold">Tudo acontece aqui dentro</p><p class="mt-1 text-tinta-500">Abra um card para ver os detalhes e responder sem sair da página. Conversas e contratos ficam registrados.</p></div>
        </aside>
      </div>
    </section>
  </main>
  <footer id="site-footer" class="border-t border-tinta/10 bg-white"></footer>
  <script src="/vendor/supabase.js" defer></script>
  <script type="module" src="/js/projetos.js"></script>
</body>
</html>
