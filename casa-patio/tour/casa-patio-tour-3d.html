<title>Casa Pátio Tour 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: tela única; canvas 3D ao fundo, faixa de controles no topo, ficha do cômodo embaixo à esquerda. */
:root{
  color-scheme: dark;
  --bg:#14171a; --panel:rgba(22,26,30,.82); --line:rgba(255,255,255,.14);
  --fg:#f3efe6; --muted:#b9b3a6; --accent:#e0a45c; --accent-ink:#22170b;
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif; --body:"Inter","Segoe UI",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;position:relative;touch-action:none;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.bar{position:fixed;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:5;
  padding:calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background:linear-gradient(to bottom, rgba(10,12,14,.72), rgba(10,12,14,0))}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.02em;font-size:1.05rem;margin-right:6px}
button,.seg{font:500 .82rem var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:8px 12px;cursor:pointer;backdrop-filter:blur(8px)}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.seg{display:flex;gap:4px;padding:3px;cursor:default}
.seg button{border:0;background:transparent;padding:6px 10px;backdrop-filter:none}
.seg button.on{background:var(--accent)}
.time{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;backdrop-filter:blur(8px)}
.time label{font-size:.78rem;color:var(--muted)}
.time output{font:600 .82rem var(--body);font-variant-numeric:tabular-nums;min-width:3.2em}
input[type=range]{width:min(34vw,170px);accent-color:var(--accent)}
.card{position:fixed;left:max(16px, env(safe-area-inset-left, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));z-index:5;
  max-width:min(92vw,360px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;backdrop-filter:blur(10px)}
.card h2{font:700 1.15rem var(--display);margin:0 0 2px;text-wrap:balance}
.card .m2{font:600 .85rem var(--body);color:var(--accent);font-variant-numeric:tabular-nums}
.card p{margin:6px 0 0;font-size:.86rem;line-height:1.45;color:var(--fg)}
.hint{position:fixed;right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));z-index:4;
  font-size:.76rem;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:min(60vw,300px);line-height:1.4}
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%, rgba(20,23,26,.55), rgba(8,9,10,.9));
  padding:24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px))}
.sheet{width:min(100%,520px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 26px;backdrop-filter:blur(14px)}
.sheet .eyebrow{font:500 .74rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.sheet h1{font:700 clamp(2rem,7vw,3rem)/1.02 var(--display);margin:.25em 0 .2em;text-wrap:balance}
.sheet .addr{color:var(--muted);font-size:.95rem}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.facts div{border-top:1px solid var(--line);padding-top:8px}
.facts b{display:block;font:700 1.15rem var(--display);font-variant-numeric:tabular-nums}
.facts span{font-size:.74rem;color:var(--muted)}
.price{font:600 1rem var(--body);margin:0 0 18px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;padding:11px 18px;font-size:.92rem}
.sel{user-select:all;-webkit-user-select:all;font:600 1.05rem var(--body);font-variant-numeric:tabular-nums}
.stick{position:fixed;left:calc(22px + env(safe-area-inset-left, 0px));bottom:calc(120px + env(safe-area-inset-bottom, 0px));width:104px;height:104px;border-radius:50%;
  border:1px solid var(--line);background:rgba(22,26,30,.45);z-index:4}
.stick i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:rgba(224,164,92,.75)}
@media (max-width:640px){.brand{width:100%}.hint{display:none}}
</style>

<canvas id="c" tabindex="0" aria-label="Vista 3D da casa"></canvas>

<div class="bar" id="bar" hidden>
  <span class="brand">Casa Pátio</span>
  <div class="seg" role="group" aria-label="Modo de vista">
    <button id="bWalk" class="on">Andar</button><button id="bDoll">Casa de bonecas</button>
  </div>
  <div class="seg" role="group" aria-label="Estilo de decoração">
    <button data-style="moderno" class="on">Moderno</button><button data-style="escandinavo">Escandinavo</button><button data-style="luxo">Luxo aconchegante</button>
  </div>
  <div class="time"><label for="hora">Hora</label><input id="hora" type="range" min="6" max="22" step="0.05" value="16.5"><output id="horaOut">16:30</output></div>
  <button id="bTour">Iniciar tour</button>
  <button id="bSom" aria-pressed="false">Som: desligado</button>
  <button id="bContato">Contato</button>
</div>

<div class="card" id="card" hidden><h2 id="cNome"></h2><div class="m2" id="cM2"></div><p id="cTxt"></p></div>
<div class="hint" id="hint" hidden></div>
<div class="stick" id="stick" hidden><i id="knob"></i></div>

<div class="overlay" id="welcome">
  <div class="sheet">
    <div class="eyebrow">Tour 3D</div>
    <h1 id="wNome"></h1>
    <div class="addr" id="wEnd"></div>
    <div class="facts">
      <div><b>2</b><span>quartos, 1 suíte com closet</span></div>
      <div><b>92 m²</b><span>de área útil</span></div>
      <div><b>8 × 25 m</b><span>de terreno</span></div>
    </div>
    <p class="price" id="wPreco"></p>
    <div class="row"><button class="primary" id="bStart">Começar</button><button id="bStartTour">Começar pelo tour guiado</button></div>
  </div>
</div>

<div class="overlay" id="contato" hidden>
  <div class="sheet">
    <div class="eyebrow">Contato</div>
    <h1 style="font-size:1.8rem" id="kNome"></h1>
    <p class="sel" id="kFone"></p>
    <p class="addr" id="kObs"></p>
    <div class="row"><button id="bCopy">Copiar telefone</button><button id="bFechar" class="primary">Fechar</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

  [3.40,16.65,3.55,17.95,"glass",{}],[0.35,18.05,1.15,18.20,"win",{sill:1.5}],

  [2.00,19.70,2.80,19.85,"door",{}],[1.40,21.35,2.20,21.50,"door",{}],[3.70,21.35,4.50,21.50,"door",{}]
];
const ROOMS = [
  {n:"Estar, jantar e cozinha",a:40.24},{n:"Lavanderia",w:2.45,d:1.50},{n:"Banho social",w:3.20,d:1.50},
  {n:"Quarto 02",w:3.20,d:3.20},{n:"Banho da suíte",w:3.20,d:1.60},{n:"Closet",w:3.20,d:1.60},
  {n:"Suíte master",w:4.45,d:3.60},{n:"Corredor interno",w:1.10,d:8.35}
];

/* ===================== BASE THREE ===================== */
const canvas = document.getElementById("c");
const isTouch = matchMedia("(pointer:coarse)").matches;
const renderer = new THREE.WebGLRenderer({canvas, antialias:!isTouch, powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, isTouch?1.5:2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(68, 1, 0.05, 200); camera.rotation.order = "YXZ";
const wx = x => x - 4, wz = y => 12.5 - y;
const world = new THREE.Group(), roof = new THREE.Group(); scene.add(world); scene.add(roof);
const colliders = [];

/* ---------- texturas procedurais ---------- */
function tex(size, draw, rx, ry){
  const cv = document.createElement("canvas"); cv.width = cv.height = size; const g = cv.getContext("2d"); draw(g, size);
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx||1, ry||1);
  t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
}
function rnd(s){ let a = s; return () => (a = (a*16807)%2147483647, (a-1)/2147483646); }
const T = {
  wood: tex(512,(g,s)=>{const r=rnd(7);g.fillStyle="#d9d9d9";g.fillRect(0,0,s,s);
    for(let i=0;i<260;i++){g.strokeStyle=`rgba(${60+r()*60|0},${50+r()*40|0},${40+r()*30|0},${.05+r()*.12})`;g.lineWidth=.6+r()*1.8;
      const y=r()*s;g.beginPath();g.moveTo(0,y);for(let x=0;x<=s;x+=32)g.lineTo(x,y+Math.sin(x*.02+i)*3+(r()-.5)*2);g.stroke();}
    for(let i=0;i<5;i++){g.fillStyle="rgba(40,30,20,.5)";g.fillRect(0,(i+1)*s/5-1,s,1.5);} },1,1),
  tile: tex(512,(g,s)=>{const r=rnd(3);g.fillStyle="#e6e6e6";g.fillRect(0,0,s,s);
    for(let i=0;i<900;i++){g.fillStyle=`rgba(120,120,120,${r()*.05})`;g.fillRect(r()*s,r()*s,2+r()*6,2+r()*6);}
    g.strokeStyle="rgba(90,90,90,.55)";g.lineWidth=2;g.strokeRect(1,1,s-2,s-2);},1,1),
  stone: tex(512,(g,s)=>{const r=rnd(11);g.fillStyle="#dedede";g.fillRect(0,0,s,s);
    for(let i=0;i<26;i++){g.strokeStyle=`rgba(70,70,70,${.08+r()*.22})`;g.lineWidth=.5+r()*2.2;g.beginPath();let x=r()*s,y=r()*s;g.moveTo(x,y);
      for(let k=0;k<9;k++){x+=(r()-.3)*90;y+=(r()-.5)*70;g.lineTo(x,y);}g.stroke();}
    for(let i=0;i<1400;i++){g.fillStyle=`rgba(40,40,40,${r()*.06})`;g.fillRect(r()*s,r()*s,1.5,1.5);}},1,1),
  fabric: tex(256,(g,s)=>{const r=rnd(5);g.fillStyle="#dcdcdc";g.fillRect(0,0,s,s);
    for(let y=0;y<s;y+=3)for(let x=0;x<s;x+=3){g.fillStyle=`rgba(${r()>.5?255:0},${r()>.5?255:0},${r()>.5?255:0},${r()*.07})`;g.fillRect(x,y,3,3);}},3,3),
  grass: tex(256,(g,s)=>{const r=rnd(9);g.fillStyle="#5f9a48";g.fillRect(0,0,s,s);
    for(let i=0;i<5000;i++){g.fillStyle=`rgba(${30+r()*60|0},${90+r()*90|0},${30+r()*40|0},.5)`;g.fillRect(r()*s,r()*s,1.2,2+r()*3);}},4,4),
  paver: tex(256,(g,s)=>{const r=rnd(13);g.fillStyle="#bdb7aa";g.fillRect(0,0,s,s);g.strokeStyle="rgba(70,66,58,.7)";g.lineWidth=2;
    for(let y=0;y<4;y++)for(let x=0;x<4;x++){{const v=r()*40|0;g.fillStyle=`rgb(${160+v},${154+v},${140+v})`;}
      g.fillRect(x*64+(y%2?32:0)-32,y*64,64,64);g.strokeRect(x*64+(y%2?32:0)-32,y*64,64,64);g.strokeRect(x*64+(y%2?32:0)+224,y*64,64,64);}},1,1),
  plaster: tex(256,(g,s)=>{const r=rnd(21);g.fillStyle="#ececec";g.fillRect(0,0,s,s);
    for(let i=0;i<2500;i++){g.fillStyle=`rgba(${r()>.5?255:90},${r()>.5?255:90},${r()>.5?255:90},${r()*.05})`;g.fillRect(r()*s,r()*s,2,2);}},2,2)
};
function art(seed, pal){ return tex(256,(g,s)=>{const r=rnd(seed);g.fillStyle=pal[0];g.fillRect(0,0,s,s);
  for(let i=0;i<7;i++){g.fillStyle=pal[1+(r()*(pal.length-1)|0)];g.globalAlpha=.55+r()*.4;
    if(r()>.5){g.beginPath();g.arc(r()*s,r()*s,20+r()*70,0,7);g.fill();}else g.fillRect(r()*s,r()*s,30+r()*120,10+r()*90);}
  g.globalAlpha=1;},1,1); }

/* ---------- materiais com nome (o estilo troca as cores) ---------- */
const M = {};
function mat(name, o){ const m = new THREE.MeshStandardMaterial(Object.assign({roughness:.8, metalness:0}, o)); M[name]=m; return m; }
mat("wall",{map:T.plaster}); mat("wallExt",{map:T.plaster}); mat("ceil",{color:0xf7f5f0,roughness:.95});
mat("floor",{map:T.tile,roughness:.28,metalness:.05}); mat("wet",{map:T.tile,roughness:.22});
mat("wood",{map:T.wood,roughness:.55}); mat("woodDark",{map:T.wood,roughness:.5});
mat("stone",{map:T.stone,roughness:.18,metalness:.05}); mat("cab",{roughness:.45});
mat("fabric",{map:T.fabric,roughness:.95}); mat("fabric2",{map:T.fabric,roughness:.95}); mat("linen",{map:T.fabric,color:0xf6f2ea,roughness:.95});
mat("rug",{map:T.fabric,roughness:1}); mat("accent",{roughness:.6});
mat("metal",{color:0x2b2d30,roughness:.35,metalness:.7}); mat("steel",{color:0xc9ccd0,roughness:.25,metalness:.85});
mat("white",{color:0xf4f4f2,roughness:.3}); mat("dark",{color:0x26282b,roughness:.5});
mat("grass",{map:T.grass,roughness:1}); mat("paver",{map:T.paver,roughness:.9}); mat("concrete",{map:T.plaster,color:0xcfc8b8,roughness:.9});
mat("muro",{map:T.plaster,color:0xd9d4c8,roughness:.95}); mat("street",{color:0x6e6a62,roughness:1}); mat("deck",{map:T.wood,color:0xb98a55,roughness:.7});
mat("leaf",{color:0x3f7d36,roughness:.8}); mat("leaf2",{color:0x5d9b4a,roughness:.8}); mat("pot",{color:0xd8d2c4,roughness:.7});
mat("brick",{color:0x9a4f2e,roughness:.9}); mat("car1",{color:0xe6e6e6,roughness:.25,metalness:.6}); mat("car2",{color:0x2a2c30,roughness:.25,metalness:.6});
mat("tire",{color:0x151515,roughness:.9});
M.glass = new THREE.MeshPhysicalMaterial({color:0xdcefF5, roughness:.02, metalness:0, transparent:true, opacity:.13, envMapIntensity:1.2, depthWrite:false});
M.water = new THREE.MeshStandardMaterial({color:0x58c0dc, roughness:.06, metalness:.1, emissive:0x1b7f9a, emissiveIntensity:.35, transparent:true, opacity:.88});
M.block = new THREE.MeshStandardMaterial({color:0xeaf3f2, roughness:.25, transparent:true, opacity:.62, emissive:0xcfdedc, emissiveIntensity:.18});
M.mirror = new THREE.MeshStandardMaterial({color:0xdfe8ec, roughness:.04, metalness:1, envMapIntensity:1.4});
M.lamp = new THREE.MeshStandardMaterial({color:0xfff1d6, emissive:0xffd9a0, emissiveIntensity:0, roughness:.6});
M.screen = new THREE.MeshStandardMaterial({color:0x0c0d0f, roughness:.15, metalness:.4});
const ART = [];
const STYLES = {
  moderno:{wall:0xf2efe8,wallExt:0xe9e5db,floor:0xe4ddd0,floorTex:"tile",wet:0xcfd4d6,wood:0xa9713f,woodDark:0x6f4526,stone:0x3a3c40,cab:0x30343a,
    fabric:0xbfb7a8,fabric2:0x6f7d86,rug:0xcfc6b4,accent:0xc56a3a,art:["#efe9dc","#c56a3a","#2f3a44","#d9b98a"]},
  escandinavo:{wall:0xfaf9f5,wallExt:0xf3f1ea,floor:0xe2c9a2,floorTex:"wood",wet:0xe3e6e4,wood:0xd9b98a,woodDark:0xb8915c,stone:0xf1efe9,cab:0xf5f4f0,
    fabric:0xdedbd2,fabric2:0x9fb3a6,rug:0xeceae2,accent:0x88a092,art:["#f7f5ee","#9fb3a6","#d9b98a","#55606a"]},
  luxo:{wall:0xe9dfd0,wallExt:0xd8ccb8,floor:0x8a5a3a,floorTex:"wood",wet:0xbfb3a2,wood:0x5a3620,woodDark:0x3a2214,stone:0x1e1c1b,cab:0x2a211b,
    fabric:0x8f7a66,fabric2:0x7a2f2a,rug:0x6d5a4a,accent:0xb8893e,art:["#2a211b","#b8893e","#7a2f2a","#e9dfd0"]}
};
let styleName = "moderno";
function applyStyle(n){
  styleName = n; const s = STYLES[n];
  for (const k of ["wall","wallExt","floor","wet","wood","woodDark","stone","cab","fabric","fabric2","rug","accent"]) M[k].color.setHex(s[k]);
  M.floor.map = s.floorTex==="wood" ? T.woodFloor : T.tile; M.floor.roughness = s.floorTex==="wood" ? .42 : .28; M.floor.needsUpdate = true;
  ART.forEach((m,i)=>{ if(m.map) m.map.dispose(); m.map = art(31+i*7+n.length, s.art); m.needsUpdate = true; });
  document.querySelectorAll("[data-style]").forEach(b=>b.classList.toggle("on", b.dataset.style===n));
}
T.woodFloor = T.wood.clone(); T.woodFloor.needsUpdate = true; T.woodFloor.repeat.set(1,1);

/* ---------- construtores ---------- */
function box(x0,y0,x1,y1,h0,h1,m,o){
  o = o||{}; const g = new THREE.BoxGeometry(Math.max(x1-x0,.001), Math.max(h1-h0,.001), Math.max(y1-y0,.001));

  {p:[1.8,22.1]},{p:[1.8,20.6],look:[0.8,20.6],stop:4,n:"Closet",a:m2(3.2,1.5),t:"Dois armários de 1,50 m e mais de 2 m de passagem entre eles."},
  {p:[2.4,20.3]},{p:[2.4,19.2],look:[1.0,18.8],stop:4,n:"Banho da suíte",a:m2(3.2,1.5),t:"Box de 1,00 m com janela alta para o jardim de inverno e bancada de 1,30 m com espelho."},
  {p:[2.4,20.3]},{p:[1.8,20.6]},{p:[1.8,22.1]},{p:[3.9,22.4]},{p:[3.9,23.95]},{p:[5.2,23.95],look:[6.8,23.6],stop:5.5,n:"Spa com pergolado",a:"3,00 × 2,40 m",t:"Jacuzzi de 2,00 × 1,80 m sob pergolado de madeira, saindo direto da suíte e de frente para o jardim."},
  {end:1}

const tour = {on:false, i:0, wait:0, yawGoal:null};
function showCard(s){ const c = document.getElementById("card"); if (!s){ c.hidden = true; return; }
  document.getElementById("cNome").textContent = s.n; document.getElementById("cM2").textContent = s.a||""; document.getElementById("cTxt").textContent = s.t||""; c.hidden = false; }
function startTour(){ tour.on = true; tour.i = 0; tour.wait = 0; tour.end = 0; setMode("walk"); P.x = TOUR[0].p[0]; P.y = TOUR[0].p[1]; P.yaw = 0; P.pitch = -.03;
  document.getElementById("bTour").textContent = "Parar tour"; document.getElementById("bTour").classList.add("on"); document.getElementById("stick").hidden = true; hint(); if (!music.on) music.toggle(true); }
function stopTour(toDoll){ tour.on = false; showCard(null); document.getElementById("bTour").textContent = "Iniciar tour"; document.getElementById("bTour").classList.remove("on"); if (toDoll) setMode("doll"); else setMode(mode); }
const angTo = (a,b)=>{ let d = (b-a)%(2*Math.PI); if (d>Math.PI) d-=2*Math.PI; if (d<-Math.PI) d+=2*Math.PI; return d; };
function tourStep(dt){
  const s = TOUR[tour.i];
  if (s.end){ tour.end += dt; if (tour.end<.1){ setMode("doll"); O.r = 14; O.pol = .5; showCard({n:CFG.projeto, a:"92 m² úteis em terreno de 8 × 25 m", t:"Sala e cozinha de 40 m² com pé-direito alto, dois quartos, corredor envidraçado e um pátio de 3 m de largura com área gourmet ao lado da cozinha."}); }
    O.r += (36-O.r)*Math.min(1,dt*.6); O.pol += (.92-O.pol)*Math.min(1,dt*.6); O.az += dt*.12; if (tour.end>14) stopTour(true); return; }
  const dx = s.p[0]-P.x, dy = s.p[1]-P.y, d = Math.hypot(dx,dy);
  if (d > .03){ const v = Math.min(d, 1.15*dt); P.x += dx/d*v; P.y += dy/d*v; if (d>.3) P.yaw += angTo(P.yaw, Math.atan2(-dx, dy))*Math.min(1,dt*2.6); P.pitch += (-.03-P.pitch)*Math.min(1,dt*2); return; }
  if (s.stop){ if (tour.wait===0) showCard(s); tour.wait += dt; P.yaw += angTo(P.yaw, Math.atan2(-(s.look[0]-P.x), s.look[1]-P.y))*Math.min(1,dt*2.2); P.pitch += (-.1-P.pitch)*Math.min(1,dt*2);
    if (tour.wait < s.stop) return; showCard(null); }
  tour.wait = 0; tour.i++;
}

/* ---------- música ambiente gerada em código ---------- */
const music = {on:false, ctx:null, gain:null, timer:null, step:0,
  toggle(force){ const want = force===undefined ? !this.on : force; const b = document.getElementById("bSom");
    if (want && !this.ctx){ try { const AC = window.AudioContext||window.webkitAudioContext; this.ctx = new AC(); } catch(e){ b.textContent = "Som indisponível"; return; }
      this.gain = this.ctx.createGain(); this.gain.gain.value = 0; const lp = this.ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value = 950;
      const dl = this.ctx.createDelay(1); dl.delayTime.value = .42; const fbk = this.ctx.createGain(); fbk.gain.value = .32;
      this.bus = this.ctx.createGain(); this.bus.connect(lp); lp.connect(this.gain); lp.connect(dl); dl.connect(fbk); fbk.connect(dl); dl.connect(this.gain); this.gain.connect(this.ctx.destination);
      const play = ()=>{ const ch = [[130.81,196,246.94,329.63],[110,164.81,261.63,329.63],[87.31,174.61,220,329.63],[98,196,246.94,293.66]][this.step++%4], t = this.ctx.currentTime;
        ch.forEach((f,i)=>{ const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = i<2?"sine":"triangle"; o.frequency.value = f*(i===3?2:1); o.detune.value = (i-1.5)*5;
          g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(i===3?.05:.11,t+2.6); g.gain.linearRampToValueAtTime(0,t+7.8); o.connect(g); g.connect(this.bus); o.start(t); o.stop(t+8); }); };
      play(); this.timer = setInterval(play, 6400); }
    if (this.ctx){ if (want) this.ctx.resume(); this.gain.gain.setTargetAtTime(want?.5:0, this.ctx.currentTime, .4); }
    this.on = want; b.textContent = want ? "Som: ligado" : "Som: desligado"; b.setAttribute("aria-pressed", want); b.classList.toggle("on", want); } };

/* ===================== MONTAGEM, UI E LAÇO ===================== */
buildWalls(); buildFloors(); buildFurniture(); applyStyle("moderno"); setTime(16.5);
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
const $ = id => document.getElementById(id);
$("wNome").textContent = CFG.projeto; $("wEnd").textContent = CFG.endereco; $("wPreco").textContent = CFG.preco ? "Valor: "+CFG.preco : "Valor a definir";
$("kNome").textContent = CFG.contatoNome || "Contato a definir"; $("kFone").textContent = CFG.contatoFone || "Telefone ainda não informado";
$("kObs").textContent = CFG.contatoFone ? "Toque no número para selecionar, ou use o botão para copiar." : "O nome e o telefone entram aqui assim que forem informados."; $("bCopy").hidden = !CFG.contatoFone;
function begin(withTour){ $("welcome").hidden = true; $("bar").hidden = false; $("hint").hidden = false; if (withTour) startTour(); else { setMode("walk"); P.x=4.65; P.y=2.2; P.yaw=0; } }
$("bStart").onclick = ()=>begin(false); $("bStartTour").onclick = ()=>begin(true);
$("bWalk").onclick = ()=>{ if (tour.on) stopTour(); setMode("walk"); }; $("bDoll").onclick = ()=>{ if (tour.on) stopTour(); O.r = 34; O.pol = .95; setMode("doll"); };
document.querySelectorAll("[data-style]").forEach(b=> b.onclick = ()=>applyStyle(b.dataset.style));
$("hora").oninput = e=>{ horaAlvo = parseFloat(e.target.value); };
$("bTour").onclick = ()=> tour.on ? stopTour() : startTour(); $("bSom").onclick = ()=>music.toggle();
$("bContato").onclick = ()=>{ $("contato").hidden = false; }; $("bFechar").onclick = ()=>{ $("contato").hidden = true; };
$("bCopy").onclick = ()=>{ const done = ()=>{ $("bCopy").textContent = "Telefone copiado"; };
  try { navigator.clipboard.writeText(CFG.contatoFone).then(done, ()=>{ getSelection().selectAllChildren($("kFone")); }); } catch(e){ getSelection().selectAllChildren($("kFone")); } };
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  if (Math.abs(horaAlvo-hora) > .002) setTime(hora + (horaAlvo-hora)*Math.min(1, dt*5));
  if (!$("welcome").hidden){ O.az += dt*.1; placeDollCam(); }
  else if (tour.on){ tourStep(dt); if (mode==="walk") placeWalkCam(dt); else placeDollCam(); }
  else if (mode==="walk"){ walkStep(dt); placeWalkCam(dt); } else placeDollCam();
  camera.updateProjectionMatrix(); updateEnv(now); renderer.render(scene, camera); requestAnimationFrame(frame);
}
roof.visible = false; requestAnimationFrame(frame);
window.__tour3d = {P, O, setMode, setTime:(t)=>{ horaAlvo = t; }, applyStyle, startTour, colliders, ROOMS, blocked, tour, begin};
